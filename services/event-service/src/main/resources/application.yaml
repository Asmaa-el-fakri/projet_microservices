spring:
  application:
    name: event-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info