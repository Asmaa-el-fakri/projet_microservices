spring:
  application:
    name: event-service
  cloud:
    config:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ticketflow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false