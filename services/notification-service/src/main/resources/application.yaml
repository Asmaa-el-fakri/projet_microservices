spring:
  application:
    name: notification-service
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      label: main

  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${NOTIFICATION_DB_USERNAME}
    password: ${NOTIFICATION_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: ${notification.kafka.group-id}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Le producteur n'est utilisé que pour publier vers les topics .DLT
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # Utilisé uniquement si notification.email.mode=smtp (valeurs fournies par variables d'environnement)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Vérifier le nom du realm Keycloak du projet
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ticketflow}

server:
  port: ${SERVER_PORT:8085}
  error:
    include-message: never
    include-stacktrace: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

notification:
  delivery:
    max-attempts: 5
    retry-base-delay: 30s
    retry-batch-size: 50
    retry-scan-interval-ms: 15000
  email:
    # log  = développement : journalise sans envoyer (statut SENT avec provider=log)
    # smtp = envoi réel via spring.mail.* (MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD)
    mode: ${NOTIFICATION_EMAIL_MODE:log}
    from: ${NOTIFICATION_EMAIL_FROM:no-reply@ticketflow.local}
  kafka:
    group-id: notification-service
    dlt-suffix: .DLT
    consumer-retry-attempts: 3
    consumer-retry-interval-ms: 1000
    topics: ticketflow.events.event,ticketflow.events.booking,ticketflow.events.payment,ticketflow.events.ticket,ticketflow.notifications.requested

logging:
  level:
    com.ticketflow.notification_service: INFO
