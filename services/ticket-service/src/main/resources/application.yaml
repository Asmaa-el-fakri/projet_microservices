server:
  port: 8085

spring:
  application:
    name: ticket-service

    security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: http://localhost:8180/realms/ticketflow

  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_db
    username: ticketflow
    password: ${POSTGRES_PASSWORD:ticketflow_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    enabled: false

    kafka:
      bootstrap-servers: localhost:9094
      consumer:
        group-id: ticket-service-group
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto-offset-reset: earliest
